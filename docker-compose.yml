# One command to run everything:  docker compose up --build
# Frontend: http://localhost:3000   Backend API docs: http://localhost:8000/docs
# Works with no .env file (mock models on). Copy .env.example to .env to add real keys.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: movemate
      POSTGRES_PASSWORD: movemate
      POSTGRES_DB: movemate
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movemate -d movemate"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://movemate:movemate@db:5432/movemate
      DATA_DIR: /data
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      MOCK_MODELS: ${MOCK_MODELS:-true}
      APP_ENV: ${APP_ENV:-dev}
    volumes:
      - ./backend:/app
      - ./data:/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:

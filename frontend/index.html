<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <meta name="theme-color" content="#ffffff" />

    <meta name="theme-color" content="#0f766e" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MoveMate" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>MoveMate Host Edition</title>
    <script>

      try {
        var m = localStorage.getItem("movemate_theme") || "system";
        var dark = m === "dark" || (m === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        var a = localStorage.getItem("movemate_accent");
        var r = document.documentElement;
        if (dark) { 
          r.classList.add("dark"); 
          r.style.colorScheme = "dark"; 
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#09090b"); 
        }
        if (a && a !== "teal") r.setAttribute("data-accent", a);
      } catch (e) {}

      // Apply saved theme before first paint (no flash).
      (function () {
        try {
          var m = localStorage.getItem("movemate_theme") || "system";
          var d = m === "dark" || (m === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          var r = document.documentElement;
          if (d) r.classList.add("dark");
          r.style.colorScheme = d ? "dark" : "light";
          r.removeAttribute("data-accent");
        } catch (e) {}
      })();

    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
